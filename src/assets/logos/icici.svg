<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 65" fill="none">
  <!-- ICICI Slanted Icon on Left -->
  <g transform="translate(5, 5) rotate(-15 15 15)">
    <ellipse cx="15" cy="15" rx="11" ry="14" fill="url(#icici-grad-correct)" />
    <!-- White dot of "i" -->
    <circle cx="15" cy="8" r="2.2" fill="#FFFFFF" />
    <!-- White trunk of "i" -->
    <path d="M12.5 13 L17.5 13 C17.5 19, 13 23, 11 25" stroke="#FFFFFF" strokeWidth="2.8" strokeLinecap="round" />
  </g>

  <!-- "ICICI" Wordmark in Blue next to the icon -->
  <text x="40" y="22" fill="#003366" fontSize="17.5" fontWeight="950" fontFamily="sans-serif" letterSpacing="0.2">ICICI</text>

  <!-- Row 2: "PRUDENTIAL" in Red with lady symbol on its right -->
  <text x="5" y="40" fill="#C4161C" fontSize="15.5" fontWeight="950" fontFamily="sans-serif" letterSpacing="-0.2">PRUDENTIAL</text>

  <!-- Prudential Lady Symbol with Red Crown -->
  <g transform="translate(136, 25)">
    <!-- Red ribbon/crown profile -->
    <path d="M0 4 C1 0, 5 -1, 10 2 C12 3, 14 3, 16 0 C16 4, 12 7, 8 7 C4 7, 1 5, 0 4 Z" fill="#C4161C" />
    <path d="M3 1 C6 -2, 10 0, 12 -2 C10 1, 6 1, 3 1 Z" fill="#C4161C" />
    <!-- Face profile line -->
    <path d="M2 5 C3 7, 4 9, 6 10 C8 11, 10 10, 11 8 C11 6, 8 5, 5 5" stroke="#333333" strokeWidth="1" strokeLinecap="round" fill="none" />
    <path d="M6 10 C7 12, 10 13, 12 11 L13 14" stroke="#333333" strokeWidth="1" strokeLinecap="round" fill="none" />
    <path d="M9 7 C10 7, 11 8, 11 9" stroke="#333333" strokeWidth="0.8" fill="none" />
  </g>

  <!-- Thin Horizontal Line -->
  <line x1="5" y1="47" x2="160" y2="47" stroke="#003366" strokeWidth="1.2" />

  <!-- Bottom text: "ASSET MANAGEMENT" in Blue -->
  <text x="5" y="58" fill="#003366" fontSize="9.2" fontWeight="900" fontFamily="sans-serif" letterSpacing="1.2">ASSET MANAGEMENT</text>

  <defs>
    <linearGradient id="icici-grad-correct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FF8200" />
      <stop offset="100%" stopColor="#BC204B" />
    </linearGradient>
  </defs>
</svg>
